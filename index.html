<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Outfit App</title>

<link rel="stylesheet" href="style.css">

</head>

<body>
  <div class="screen">
    <div class="top-row">
      <div class="temp-block">
        <p id="temp" class="temp"></p>
        <p id="weather" class="condition"></p>
      </div>
      <div class="extra-info">
        <span id="wind"></span>
        <span id="rain"></span>
      </div>
    </div>

    <div class="character-stage">
      <div class="character-placeholder" id="characterPlaceholder">
        <span id="stateLabel">loading...</span>
        <div id="umbrellaIcon" class="umbrella-icon hidden">☂</div>
      </div>
      <div class="option-dots" id="optionDots"></div>
    </div>

    <p id="loading"></p>
  </div>

  <script src="script.js"></script>
</body>
</html>
