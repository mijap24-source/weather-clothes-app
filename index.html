<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Outfit App</title>

<link rel="stylesheet" href="style.css">

</head>

<body>
  <div class="screen">
    <div class="top-row">
    <div class="temp-block">
        <p id="temp" class="temp"></p>
        <p id="weather" class="condition"></p>
    </div>
    <div class="extra-info">
        <span id="wind"></span>
        <span id="rain"></span>
    </div>
    </div>

    <div class="character-stage">
      <div class="character-placeholder" id="characterPlaceholder">
        <span id="stateLabel" class="hidden"></span>

        <img src="images/base.png" class="layer-img" id="baseImg">

        <img src="images/bottom1.png" class="layer-img bottom-img hidden" id="bottom1Img">
        <img src="images/bottom2.png" class="layer-img bottom-img hidden" id="bottom2Img">
        <img src="images/bottom3.png" class="layer-img bottom-img hidden" id="bottom3Img">

        <img src="images/top0.png" class="layer-img top-img hidden" id="top0Img">
        <img src="images/top1.png" class="layer-img top-img hidden" id="top1Img">
        <img src="images/top2.png" class="layer-img top-img hidden" id="top2Img">
        <img src="images/top3.png" class="layer-img top-img hidden" id="top3Img">

        <img src="images/thinlayer.png" class="layer-img outer-img hidden" id="outerThinLayerImg">
        <img src="images/coat.png" class="layer-img outer-img hidden" id="outerCoatImg">
        <img src="images/jacket.png" class="layer-img outer-img hidden" id="outerJacketImg">
        <img src="images/scarf.png" class="layer-img outer-img hidden" id="outerScarfImg">

        <img src="images/umbrella.png" class="umbrella-icon hidden" id="umbrellaIcon">
      </div>
      </div>
      <div class="option-dots" id="optionDots"></div>
    </div>

    <p id="loading"></p>
  </div>

  <script src="script.js"></script>
</body>
</html>
